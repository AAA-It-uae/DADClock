name: Apply hardening patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply hardening patch
        shell: bash
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          printf '%s' '' | base64 -d | gzip -d > hardening.patch
          git apply --check hardening.patch
          git apply --whitespace=nowarn hardening.patch
          rm hardening.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clock.cpp README.md DADClock.rc build.bat tools/verify_pe.py .github/workflows/build-windows.yml
          git commit -m "Harden DAD Clock release and settings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
