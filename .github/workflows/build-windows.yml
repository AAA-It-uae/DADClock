name: Build Windows x86

# Pull requests build with read-only permissions. Only the main-branch sync job can write generated release files.
on:
  push:
    branches: [main]
    paths:
      - "clock.cpp"
      - "build.bat"
      - "DADClock.rc"
      - "resource.h"
      - "assets/DADClock-11-11.svg"
      - "assets/DADClock-11-11.png"
      - "make_icon.py"
      - "tools/verify_pe.py"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "clock.cpp"
      - "build.bat"
      - "DADClock.rc"
      - "resource.h"
      - "assets/DADClock-11-11.svg"
      - "assets/DADClock-11-11.png"
      - "make_icon.py"
      - "tools/verify_pe.py"
      - "README.md"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dadclock-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows XP-11 x86 build
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned icon and PE verification tools
        run: python -m pip install --disable-pip-version-check pillow==12.3.0 pefile==2024.8.26

      - name: Regenerate application assets
        run: python make_icon.py

      - name: Build DAD Clock
        shell: cmd
        run: call build.bat

      - name: Verify portable PE and reviewed XP-era import surface
        run: python tools/verify_pe.py DADClock.exe

      - name: SHA-256
        shell: powershell
        run: Get-FileHash DADClock.exe -Algorithm SHA256 | Format-List

      - name: Upload portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DADClock-Windows-x86
          if-no-files-found: error
          retention-days: 30
          path: |
            DADClock.exe
            DADClock.ico
            assets/DADClock-11-11.png
            assets/DADClock-11-11.ico
            assets/DADClock-11-11.svg
            README.md
            LICENSE
            NOTICE

  sync_release:
    name: Synchronize main release files
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned icon and PE verification tools
        run: python -m pip install --disable-pip-version-check pillow==12.3.0 pefile==2024.8.26

      - name: Rebuild verified release files
        shell: cmd
        run: |
          python make_icon.py
          call build.bat

      - name: Verify release before repository sync
        run: python tools/verify_pe.py DADClock.exe

      - name: Synchronize generated release files
        shell: powershell
        run: |
          Copy-Item DADClock.ico assets/DADClock-11-11.ico -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADClock.exe DADClock.ico assets/DADClock-11-11.png assets/DADClock-11-11.ico
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Rebuild DAD Clock release [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Generated release files are already synchronized."
          }

      - name: Clean merged agent branches
        shell: powershell
        run: |
          $branches = @(
            "agent/clock-display-settings-upgrade",
            "agent/embed-supplied-clock-icon",
            "agent/font-color-live-preview",
            "agent/font-color-live-preview-check",
            "agent/rename-baba-to-dad-clock",
            "agent/validate-windows-build",
            "agent/validate-windows-build-2",
            "agent/validate-windows-build-final",
            "agent/validate-windows-build-pr",
            "agent/validate-windows-build-run",
            "agent/full-hardening-pass",
            "agent/full-hardening-pass-check",
            "agent/full-hardening-pass-ci",
            "agent/full-hardening-pass-pr",
            "agent/full-hardening-pass-stage",
            "agent/full-hardening-pass-temp"
          )
          foreach ($branch in $branches) {
            git ls-remote --exit-code --heads origin "refs/heads/$branch" *> $null
            if ($LASTEXITCODE -eq 0) {
              git push origin --delete $branch
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to delete stale branch $branch"
              }
            }
          }
