name: Build Windows x86

# Pull requests build and verify only. Successful main pushes synchronize generated release files.
on:
  push:
    branches: [main]
    paths:
      - "clock.cpp"
      - "build.bat"
      - "DADClock.rc"
      - "resource.h"
      - "assets/DADClock-11-11.svg"
      - "assets/DADClock-11-11.png"
      - "make_icon.py"
      - "tools/verify_pe.py"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "clock.cpp"
      - "build.bat"
      - "DADClock.rc"
      - "resource.h"
      - "assets/DADClock-11-11.svg"
      - "assets/DADClock-11-11.png"
      - "make_icon.py"
      - "tools/verify_pe.py"
      - "README.md"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows XP-11 x86 build
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install icon and PE verification tools
        run: python -m pip install --disable-pip-version-check pillow pefile

      - name: Regenerate application assets
        run: python make_icon.py

      - name: Build DAD Clock
        shell: cmd
        run: call build.bat

      - name: Verify portable PE
        run: python tools/verify_pe.py DADClock.exe

      - name: SHA-256
        shell: powershell
        run: Get-FileHash DADClock.exe -Algorithm SHA256 | Format-List

      - name: Synchronize generated release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          Copy-Item DADClock.ico assets/DADClock-11-11.ico -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADClock.exe DADClock.ico assets/DADClock-11-11.png assets/DADClock-11-11.ico
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Rebuild DAD Clock release [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Generated release files are already synchronized."
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: DADClock-Windows-x86
          if-no-files-found: error
          retention-days: 30
          path: |
            DADClock.exe
            DADClock.ico
            DADClock.rc
            clock.cpp
            build.bat
            resource.h
            make_icon.py
            tools/verify_pe.py
            .github/workflows/build-windows.yml
            assets/DADClock-11-11.png
            assets/DADClock-11-11.ico
            assets/DADClock-11-11.svg
            README.md
            LICENSE
            NOTICE
